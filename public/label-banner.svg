<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" role="img" aria-label="মাশরুম ডেন্টোকেয়ার প্লাস লেবেল">
  <rect width="1060" height="300" fill="#ffffff"/>
  <rect x="6" y="6" width="1048" height="288" fill="none" stroke="#0a7a4a" stroke-width="10"/>
  <rect x="18" y="18" width="1024" height="264" fill="none" stroke="#e11d48" stroke-width="3"/>
  <g font-family="'Hind Siliguri','Nirmala UI','Vrinda',sans-serif">
    <!-- left text block -->
    <g fill="#1f2937" font-size="15">
      <text x="40" y="58">দাঁতের যত্নে প্রাকৃতিক উপাদান সমৃদ্ধ টুথ পাউডার।</text>
      <text x="40" y="82">মাশরুম, প্রাকৃতিক ক্যালসিয়াম, আওবেল, দারুচিনি,</text>
      <text x="40" y="106">লবঙ্গ সহ ৪০টিরও বেশি ভেষজ উপাদানে তৈরি।</text>
    </g>
    <text x="40" y="160" font-size="17" font-weight="700" fill="#0a7a4a">প্রাকৃতিক অ্যান্টিবায়োটিক</text>
    <text x="40" y="205" font-size="15" font-weight="600" fill="#111827">Marketed By:</text>
    <rect x="40" y="215" width="150" height="44" rx="8" fill="#0a7a4a"/>
    <text x="115" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">FatehaBD</text>
    <text x="230" y="248" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111827">Net Weight: 100gm</text>
    <!-- center tooth -->
    <path d="M530 34c-62 0-100 34-100 92 0 48 20 76 30 118 5 22 12 40 28 40 20 0 20-54 42-54s22 54 42 54c16 0 23-18 28-40 10-42 30-70 30-118 0-58-38-92-100-92z" fill="#0a7a4a"/>
    <text x="530" y="108" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">মাশরুম</text>
    <rect x="452" y="122" width="156" height="38" rx="19" fill="#ffffff"/>
    <text x="530" y="149" text-anchor="middle" font-size="22" font-weight="700" fill="#e11d48">ডেন্টোকেয়ার</text>
    <text x="530" y="188" text-anchor="middle" font-size="19" font-weight="600" fill="#d1fae1">প্লাস • টুথ পাউডার</text>
    <text x="640" y="56" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#0a7a4a">TM</text>
    <!-- right block -->
    <rect x="700" y="36" width="320" height="40" rx="8" fill="#0a7a4a"/>
    <text x="860" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">সজীব ও সুস্থ দাঁতের প্রতিশ্রুতি</text>
    <g fill="#1f2937" font-size="15">
      <text x="700" y="110">ব্যবহার বিধি: সকালে ১ গ্রাম ও রাতে ১ গ্রাম</text>
      <text x="700" y="134">পাউডার দিয়ে ব্রাশ করুন।</text>
      <text x="700" y="166">দাঁতে ব্যথা থাকলে রাতে ঘুমানোর সময়</text>
      <text x="700" y="190">ব্যথার স্থানে পাউডার দিয়ে রাখুন।</text>
    </g>
    <text x="700" y="250" font-size="17" font-weight="700" fill="#e11d48">সর্বোচ্চ খুচরা মূল্য: ৭৫০ টাকা</text>
  </g>
</svg>
